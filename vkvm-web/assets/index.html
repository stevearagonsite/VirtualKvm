<!doctype html>
<html lang="es" id="html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VirtualKvm</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #677085; --line: #d9dde5;
    --local: #3b6fd8; --local-fill: #e8eefc; --remote: #d9822b; --remote-fill: #fdf0e3;
    --seg: #1f9d55; --bad: #c53030; --accent: #3b6fd8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #98a1b3; --line: #2c3340;
      --local: #6d97ff; --local-fill: #1d2a45; --remote: #f0a35b; --remote-fill: #3a2a1a;
      --seg: #48c78e; --bad: #fc8181; --accent: #6d97ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 20px 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .status { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; padding: 8px 20px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #stage { position: relative; min-height: 420px; padding: 8px; }
  svg { width: 100%; height: 100%; min-height: 420px; display: block; touch-action: none; }
  .local rect { fill: var(--local-fill); stroke: var(--local); stroke-width: 1.5; }
  .remote rect { fill: var(--remote-fill); stroke: var(--remote); stroke-width: 2; cursor: grab; }
  .remote.dragging rect { cursor: grabbing; opacity: .85; }
  .remote.unlinked rect { stroke-dasharray: 6 4; }
  text { fill: var(--text); font-size: 12px; pointer-events: none; }
  text.sub { fill: var(--muted); font-size: 11px; }
  line.seg { stroke: var(--seg); stroke-width: 5; stroke-linecap: round; }
  aside { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  aside h2 { font-size: 14px; margin: 0; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input { width: 90px; text-align: right; }
  button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
  .msg { font-size: 12px; min-height: 1.4em; }
  .msg.ok { color: var(--seg); } .msg.bad { color: var(--bad); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 20px; flex-wrap: wrap; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="title">VirtualKvm</h1>
  <span class="status" id="status">conectando…</span>
</header>
<div class="legend">
  <span><span class="sw" style="background:var(--local-fill);border:1.5px solid var(--local)"></span><span id="lg-local"></span></span>
  <span><span class="sw" style="background:var(--remote-fill);border:2px solid var(--remote)"></span><span id="lg-remote"></span></span>
  <span><span class="sw" style="background:var(--seg)"></span><span id="lg-seg"></span></span>
</div>
<main>
  <section class="card" id="stage"><svg id="svg"></svg></section>
  <aside class="card" id="panel"><p class="hint">…</p></aside>
</main>
<footer style="padding:0 20px 20px;color:var(--muted);font-size:12px">
  VirtualKvm · <span id="based">basado en</span> <a href="https://github.com/feschber/lan-mouse" target="_blank" rel="noopener" style="color:inherit">Lan Mouse</a> · GPL-3.0-or-later
</footer>

<script>
"use strict";

const I18N = {
  es: {
    title: "VirtualKvm · Monitores", lgLocal: "Esta máquina (posición real de sus monitores)",
    lgRemote: "Monitores de la otra máquina (arrastralos juntos)", lgSeg: "Bordes por donde pasa el mouse",
    connecting: "conectando…", status: (l, c) => `daemon conectado · ${l} monitor(es) locales · ${c} cliente(s)`,
    disconnected: "daemon desconectado", badToken: "token inválido: abrí la URL que imprimió `vkvm web`",
    noClients: "No hay clientes configurados.", client: "Cliente", machine: "Máquina",
    displays: n => `${n} monitor(es)`, connected: "conectada",
    horizontal: "Horizontal (px) — positivo = a la derecha", vertical: "Vertical (px) — positivo = más abajo",
    crossesAt: "El mouse pasa por:", edge: (side, name, len) => `• borde ${side} de <b>${name}</b> (${len} px)`,
    sides: { left: "izquierdo", right: "derecho", top: "superior", bottom: "inferior" },
    notTouching: "Los monitores no se tocan: no hay por dónde pasar.", overlapping: "Se superponen: corregilo antes de guardar.",
    suggested: "Posición sugerida: todavía no hay layout guardado.", unsaved: "Hay cambios sin guardar.",
    save: "Guardar", clear: "Quitar layout",
    help: "Arrastrá los monitores naranjas (se mueven juntos) hasta que toquen los tuyos: se pegan solos a los bordes. Lo que guardes acá se aplica también en la otra máquina.",
    estimated: " (estimado: esperando al peer)", monitor: i => `Monitor ${i}`,
    dropOnEdge: "Se superpone con un monitor tuyo: soltalo pegado al borde.",
    notSavedOverlap: "No se guardó: los monitores se superponen.", notSavedTouch: "No se guardó: los monitores no se tocan.",
    saved: "Guardado ✓ (también en la otra máquina)", cleared: "Layout quitado: se usa el borde de todo el escritorio.",
    error: "Error: ", options: "Opciones", language: "Idioma", clipboard: "Compartir el portapapeles (texto) al pasar el mouse",
    invertScroll: "Invertir el scroll del mouse que viene de otra máquina (para que coincida con LinearMouse / tu configuración)",
    metaRaycast: "La tecla Windows / Cmd sola abre Raycast en esta máquina (Raycast ignora las teclas simuladas)",
    optionsSaved: "Opciones guardadas ✓", based: "basado en",
  },
  en: {
    title: "VirtualKvm · Displays", lgLocal: "This machine (real position of its displays)",
    lgRemote: "Displays of the other machine (drag them together)", lgSeg: "Edges the mouse crosses",
    connecting: "connecting…", status: (l, c) => `daemon connected · ${l} local display(s) · ${c} client(s)`,
    disconnected: "daemon disconnected", badToken: "invalid token: open the URL printed by `vkvm web`",
    noClients: "No clients configured.", client: "Client", machine: "Machine",
    displays: n => `${n} display(s)`, connected: "connected",
    horizontal: "Horizontal (px) — positive = to the right", vertical: "Vertical (px) — positive = lower",
    crossesAt: "The mouse crosses at:", edge: (side, name, len) => `• ${side} edge of <b>${name}</b> (${len} px)`,
    sides: { left: "left", right: "right", top: "top", bottom: "bottom" },
    notTouching: "The displays don't touch: there is nowhere to cross.", overlapping: "They overlap: fix it before saving.",
    suggested: "Suggested position: no layout saved yet.", unsaved: "There are unsaved changes.",
    save: "Save", clear: "Remove layout",
    help: "Drag the orange displays (they move together) until they touch yours: they snap to the edges. What you save here is applied on the other machine too.",
    estimated: " (estimated: waiting for the peer)", monitor: i => `Display ${i}`,
    dropOnEdge: "It overlaps one of your displays: drop it against an edge.",
    notSavedOverlap: "Not saved: the displays overlap.", notSavedTouch: "Not saved: the displays don't touch.",
    saved: "Saved ✓ (on the other machine too)", cleared: "Layout removed: the edge of the whole desktop is used.",
    error: "Error: ", options: "Options", language: "Language", clipboard: "Share the clipboard (text) when the mouse moves over",
    invertScroll: "Reverse the scroll of the mouse coming from another machine (to match LinearMouse / your settings)",
    metaRaycast: "Tapping the Windows / Cmd key alone opens Raycast on this machine (Raycast ignores simulated hotkeys)",
    optionsSaved: "Options saved ✓", based: "based on",
  },
};
let lang = (navigator.language || "es").startsWith("es") ? "es" : "en";
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === "function" ? v(...a) : v; };
function applyStatic() {
  document.getElementById("html").lang = lang;
  document.title = t("title");
  for (const [id, k] of [["title", "title"], ["lg-local", "lgLocal"], ["lg-remote", "lgRemote"], ["lg-seg", "lgSeg"], ["based", "based"]])
    document.getElementById(id).textContent = t(k);
}
// VirtualKvm layout editor (layout v2): the peer's displays are placed as a group
// at local = remote + (dx, dy); the cursor crosses wherever displays touch.
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
const svg = document.getElementById("svg");
const panel = document.getElementById("panel");
const statusEl = document.getElementById("status");
const NS = "http://www.w3.org/2000/svg";
const SNAP_PX = 12;   // snapping distance in screen pixels
const TOUCH = 2;      // px under which two edges touch (same as the daemon)

let snap = null, selected = null, drag = null, view = null;
let draft = {};       // handle -> {dx, dy} not saved yet
let message = { text: "", cls: "" };

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "x-vkvm-token": token, "content-type": "application/json" } });
  if (!r.ok) throw new Error(r.status === 401 ? t("badToken") : "HTTP " + r.status);
  return r.status === 204 ? null : r.json();
}
const clientName = c => c.config.hostname || (c.config.fix_ips[0] ?? ("cliente " + c.handle));
const rect = d => ({ x: d.x, y: d.y, w: d.width, h: d.height });

// ---------- model ----------
function remotes(c) {
  const r = c.state.remote_displays;
  return r.length ? r.map((d, i) => ({ ...rect(d), label: t("monitor", i + 1), known: true }))
                  : [{ x: 0, y: 0, w: 1920, h: 1080, label: t("monitor", 1), known: false }];
}
function bbox(rs) {
  return rs.reduce((b, r) => ({ x0: Math.min(b.x0, r.x), y0: Math.min(b.y0, r.y), x1: Math.max(b.x1, r.x + r.w), y1: Math.max(b.y1, r.y + r.h) }),
    { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity });
}
function layoutOf(c) {
  if (draft[c.handle]) return { ...draft[c.handle], saved: false };
  if (c.config.layout) return { ...c.config.layout, saved: true };
  // no layout yet: suggest the peer on the configured side of our desktop
  const L = bbox(snap.local.map(rect)), R = bbox(remotes(c));
  const side = c.config.pos;
  const dx = side === "left" ? L.x0 - R.x1 : side === "right" ? L.x1 - R.x0 : L.x0 - R.x0;
  const dy = side === "top" ? L.y0 - R.y1 : side === "bottom" ? L.y1 - R.y0 : L.y0 - R.y0;
  return { dx, dy, saved: false, suggested: true };
}
const placed = (c, lay) => remotes(c).map(r => ({ ...r, x: r.x + lay.dx, y: r.y + lay.dy }));

function contacts(c, lay) {
  const out = [];
  for (const L of snap.local.map(rect)) for (const R of placed(c, lay)) {
    const yo = [Math.max(L.y, R.y), Math.min(L.y + L.h, R.y + R.h)];
    const xo = [Math.max(L.x, R.x), Math.min(L.x + L.w, R.x + R.w)];
    const cand = [
      ["left", Math.abs(R.x + R.w - L.x), yo, L.x], ["right", Math.abs(R.x - (L.x + L.w)), yo, L.x + L.w],
      ["top", Math.abs(R.y + R.h - L.y), xo, L.y], ["bottom", Math.abs(R.y - (L.y + L.h)), xo, L.y + L.h]];
    for (const [side, gap, [from, to], edge] of cand)
      if (gap <= TOUCH && to > from) out.push({ side, from, to, edge });
  }
  return out;
}
function overlaps(c, lay) {
  return placed(c, lay).some(R => snap.local.map(rect).some(L =>
    Math.min(L.x + L.w, R.x + R.w) - Math.max(L.x, R.x) > TOUCH && Math.min(L.y + L.h, R.y + R.h) - Math.max(L.y, R.y) > TOUCH));
}
// magnetic snapping of the dragged group to local edges (each axis independently)
function snapLayout(c, lay) {
  const tol = SNAP_PX / view.scale, Ls = snap.local.map(rect), Rs = placed(c, lay);
  let bx = null, by = null;
  for (const L of Ls) for (const R of Rs) {
    for (const d of [L.x - (R.x + R.w), L.x + L.w - R.x, L.x - R.x, L.x + L.w - (R.x + R.w)])
      if (Math.abs(d) <= tol && (bx === null || Math.abs(d) < Math.abs(bx))) bx = d;
    for (const d of [L.y - (R.y + R.h), L.y + L.h - R.y, L.y - R.y, L.y + L.h - (R.y + R.h)])
      if (Math.abs(d) <= tol && (by === null || Math.abs(d) < Math.abs(by))) by = d;
  }
  return { dx: Math.round(lay.dx + (bx ?? 0)), dy: Math.round(lay.dy + (by ?? 0)) };
}

// ---------- rendering ----------
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function computeView(rs) {
  const box = svg.getBoundingClientRect(), W = Math.max(box.width, 300), H = Math.max(box.height, 300);
  const b = bbox(rs), pad = 700;
  const minX = b.x0 - pad, maxX = b.x1 + pad, minY = b.y0 - pad, maxY = b.y1 + pad;
  const scale = Math.min(W / (maxX - minX), H / (maxY - minY));
  return { scale, ox: (W - (maxX - minX) * scale) / 2 - minX * scale, oy: (H - (maxY - minY) * scale) / 2 - minY * scale, W, H };
}
const sx = x => x * view.scale + view.ox, sy = y => y * view.scale + view.oy;

function drawRect(r, cls, title, sub, parent) {
  const g = el("g", { class: cls }, parent);
  const e = el("rect", { x: sx(r.x), y: sy(r.y), width: r.w * view.scale, height: r.h * view.scale, rx: 4 }, g);
  el("text", { x: sx(r.x) + 8, y: sy(r.y) + 18 }, g).textContent = title;
  el("text", { x: sx(r.x) + 8, y: sy(r.y) + 34, class: "sub" }, g).textContent = sub;
  return e;
}

function render() {
  svg.innerHTML = "";
  if (!snap) return;
  const c = snap.clients.find(c => c.handle === selected);
  const lay = c ? (drag ? drag.lay : layoutOf(c)) : null;
  if (!drag) view = computeView([...snap.local.map(rect), ...(c ? placed(c, lay) : [])]);
  svg.setAttribute("viewBox", `0 0 ${view.W} ${view.H}`);
  for (const d of snap.local) drawRect(rect(d), "local", d.name + (d.primary ? " ★" : ""), `${d.width}×${d.height} · ${d.scale}x`, svg);
  if (!c) return;
  for (const k of contacts(c, lay)) {
    const [x1, y1, x2, y2] = (k.side === "left" || k.side === "right") ? [k.edge, k.from, k.edge, k.to] : [k.from, k.edge, k.to, k.edge];
    el("line", { class: "seg", x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2) }, svg);
  }
  const group = el("g", { class: "remote" + (drag ? " dragging" : "") + (lay.saved ? "" : " unlinked") }, svg);
  for (const r of placed(c, lay)) {
    const e = drawRect(r, "", `${clientName(c)} · ${r.label}`, `${r.w}×${r.h}` + (r.known ? "" : t("estimated")), group);
    e.addEventListener("pointerdown", ev => startDrag(ev, c, lay));
  }
}

function startDrag(ev, c, lay) {
  ev.preventDefault(); svg.setPointerCapture(ev.pointerId);
  drag = { handle: c.handle, start: { x: ev.clientX, y: ev.clientY }, orig: { dx: lay.dx, dy: lay.dy }, lay: { dx: lay.dx, dy: lay.dy } };
  render();
}
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  const c = snap.clients.find(c => c.handle === drag.handle);
  const free = { dx: drag.orig.dx + (ev.clientX - drag.start.x) / view.scale, dy: drag.orig.dy + (ev.clientY - drag.start.y) / view.scale };
  drag.lay = snapLayout(c, free);
  render();
});
svg.addEventListener("pointerup", async () => {
  if (!drag) return;
  const c = snap.clients.find(c => c.handle === drag.handle), lay = drag.lay;
  drag = null;
  if (overlaps(c, lay)) { setMsg(t("dropOnEdge"), "bad"); render(); return; }
  draft[c.handle] = lay; render(); renderPanel();
  await save(c);
});

// ---------- side panel ----------
function setMsg(text, cls) { message = { text, cls }; const m = document.getElementById("msg"); if (m) { m.textContent = text; m.className = "msg " + cls; } }

function renderPanel() {
  if (!snap) return;
  if (!snap.clients.length) { panel.innerHTML = `<p class="hint">${t("noClients")}</p>` + optionsHtml(); bindOptions(); return; }
  if (!snap.clients.some(c => c.handle === selected)) selected = snap.clients[0].handle;
  const c = snap.clients.find(c => c.handle === selected), lay = layoutOf(c), ks = contacts(c, lay);
  const active = document.activeElement && document.activeElement.id;
  const local = snap.local.map(rect);
  const onDisplay = k => snap.local.find(d => { const L = rect(d); return (k.side === "left" && L.x === k.edge) || (k.side === "right" && L.x + L.w === k.edge) || (k.side === "top" && L.y === k.edge) || (k.side === "bottom" && L.y + L.h === k.edge); });
  panel.innerHTML = `
    <h2>${t("client")}</h2>
    <label>${t("machine")}
      <select id="client">${snap.clients.map(x => `<option value="${x.handle}" ${x.handle === selected ? "selected" : ""}>${clientName(x)} · ${t("displays", x.state.remote_displays.length)}${x.state.alive ? " · " + t("connected") : ""}</option>`).join("")}</select>
    </label>
    <label>${t("horizontal")}
      <div class="row"><button data-a="dx" data-d="-10">−10</button><button data-a="dx" data-d="-1">−1</button>
        <input id="dx" type="number" value="${lay.dx}"><button data-a="dx" data-d="1">+1</button><button data-a="dx" data-d="10">+10</button></div>
    </label>
    <label>${t("vertical")}
      <div class="row"><button data-a="dy" data-d="-10">−10</button><button data-a="dy" data-d="-1">−1</button>
        <input id="dy" type="number" value="${lay.dy}"><button data-a="dy" data-d="1">+1</button><button data-a="dy" data-d="10">+10</button></div>
    </label>
    <p class="hint">${ks.length ? t("crossesAt") + "<br>" + ks.map(k => t("edge", t("sides")[k.side], (onDisplay(k) || {}).name || "?", Math.round(k.to - k.from))).join("<br>")
        : `<span style="color:var(--bad)">${t("notTouching")}</span>`}
      ${overlaps(c, lay) ? `<br><span style="color:var(--bad)">${t("overlapping")}</span>` : ""}
      ${lay.saved ? "" : "<br>" + (lay.suggested ? t("suggested") : t("unsaved"))}</p>
    <div class="row"><button class="primary" id="save">${t("save")}</button><button id="clear" ${c.config.layout ? "" : "disabled"}>${t("clear")}</button></div>
    <div id="msg" class="msg ${message.cls}">${message.text}</div>
    <p class="hint">${t("help")}</p>` + optionsHtml();
  bindOptions();
  const upd = patch => { const l = layoutOf(c); draft[c.handle] = { dx: l.dx, dy: l.dy, ...patch }; render(); renderPanel(); };
  panel.querySelector("#client").onchange = e => { selected = Number(e.target.value); render(); renderPanel(); };
  for (const a of ["dx", "dy"]) { const i = panel.querySelector("#" + a); i.onchange = () => upd({ [a]: Math.round(Number(i.value) || 0) }); }
  panel.querySelectorAll("button[data-d]").forEach(b => b.onclick = () => upd({ [b.dataset.a]: layoutOf(c)[b.dataset.a] + Number(b.dataset.d) }));
  panel.querySelector("#save").onclick = () => save(c);
  panel.querySelector("#clear").onclick = () => clearLayout(c);
  if (active === "dx" || active === "dy") { const o = panel.querySelector("#" + active); o.focus(); o.select(); }
}

async function save(c) {
  const lay = layoutOf(c);
  if (overlaps(c, lay)) { setMsg(t("notSavedOverlap"), "bad"); return; }
  if (!contacts(c, lay).length) { setMsg(t("notSavedTouch"), "bad"); return; }
  try {
    await api("/api/layout", { method: "POST", body: JSON.stringify({ handle: c.handle, layout: { dx: lay.dx, dy: lay.dy } }) });
    delete draft[c.handle]; setMsg(t("saved"), "ok"); await refresh();
  } catch (e) { setMsg(t("error") + e.message, "bad"); }
}
async function clearLayout(c) {
  try {
    await api("/api/layout", { method: "POST", body: JSON.stringify({ handle: c.handle, layout: null }) });
    delete draft[c.handle]; setMsg(t("cleared"), "ok"); await refresh();
  } catch (e) { setMsg(t("error") + e.message, "bad"); }
}

// ---------- options ----------
function optionsHtml() {
  const st = (snap && snap.settings) || { language: lang, clipboard: true, invert_scroll: false, meta_tap_raycast: false };
  return `<hr><h2>${t("options")}</h2>
    <label>${t("language")}
      <select id="opt-lang"><option value="es" ${st.language === "es" ? "selected" : ""}>Español</option><option value="en" ${st.language === "en" ? "selected" : ""}>English</option></select>
    </label>
    <label class="check"><input type="checkbox" id="opt-clip" ${st.clipboard ? "checked" : ""}> ${t("clipboard")}</label>
    <label class="check"><input type="checkbox" id="opt-scroll" ${st.invert_scroll ? "checked" : ""}> ${t("invertScroll")}</label>
    <label class="check"><input type="checkbox" id="opt-meta" ${st.meta_tap_raycast ? "checked" : ""}> ${t("metaRaycast")}</label>`;
}
function bindOptions() {
  const l = panel.querySelector("#opt-lang"), c = panel.querySelector("#opt-clip"), sc = panel.querySelector("#opt-scroll"), mt = panel.querySelector("#opt-meta");
  if (!l || !c || !sc || !mt) return;
  const save = async () => {
    try {
      await api("/api/settings", { method: "POST", body: JSON.stringify({ language: l.value, clipboard: c.checked, invert_scroll: sc.checked, meta_tap_raycast: mt.checked }) });
      lang = l.value; applyStatic(); setMsg(t("optionsSaved"), "ok"); await refresh();
    } catch (e) { setMsg(t("error") + e.message, "bad"); }
  };
  l.onchange = save; c.onchange = save; sc.onchange = save; mt.onchange = save;
}

// ---------- polling ----------
async function refresh() {
  try {
    snap = await api("/api/state");
    if (snap.settings && snap.settings.language !== lang) { lang = snap.settings.language; applyStatic(); }
    statusEl.textContent = snap.connected ? t("status", snap.local.length, snap.clients.length) : t("disconnected");
  } catch (e) { statusEl.textContent = e.message; return; }
  if (!drag) { render(); if (!panel.contains(document.activeElement) || ["BUTTON"].includes(document.activeElement.tagName)) renderPanel(); }
}
window.addEventListener("resize", () => { if (!drag) render(); });
applyStatic();
statusEl.textContent = t("connecting");
refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>

[package]
name = "vkvm-clipboard"
description = "Text clipboard access for VirtualKvm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/stevearagonsite/VirtualKvm"

[dependencies]
arboard = { version = "3.7", default-features = false }
log = "0.4.20"

[target.'cfg(target_os="macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSEnumerator"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
